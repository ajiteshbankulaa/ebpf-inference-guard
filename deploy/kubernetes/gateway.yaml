apiVersion: apps/v1
kind: Deployment
metadata:
  name: shield-gateway
  namespace: shield-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shield-gateway
  template:
    metadata:
      labels:
        app: shield-gateway
    spec:
      containers:
        - name: gateway
          image: 296062591117.dkr.ecr.us-east-1.amazonaws.com/ebpf-shield:build-day4-20261014-2348z
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/gateway"]
          args: ["-listen", ":8080", "-metrics-listen", ":9101", "-max-cost-score", "2000"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9101
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shield-gateway
  namespace: shield-system
spec:
  type: ClusterIP
  selector:
    app: shield-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9101
      targetPort: metrics
